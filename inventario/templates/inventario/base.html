<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAUQUEVA - Sistema de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden font-sans text-gray-800">

    <!-- BARRA LATERAL (Sidebar) -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20">
        <!-- Logo -->
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <span class="material-icons text-green-700 text-3xl mr-2">eco</span>
            <div class="leading-tight">
                <h1 class="text-lg font-bold text-gray-800">CAUQUEVA</h1>
                <span class="text-xs text-gray-500">Sistema de Gestión</span>
            </div>
        </div>

        <!-- Menú de Navegación -->
<nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">

    <a href="{% url 'panelprincipal' %}"
       class="flex items-center px-3 py-2.5 rounded-lg font-medium transition-colors
              {% if request.resolver_match.url_name == 'panelprincipal' %}text-green-800 bg-green-100{% else %}text-gray-600 hover:bg-gray-50 hover:text-green-700{% endif %}">
        <span class="material-icons mr-3 {% if request.resolver_match.url_name == 'panelprincipal' %}text-green-700{% else %}text-gray-400{% endif %}">dashboard</span>
        Panel Principal
    </a>

    <a href="{% url 'inventariostock' %}"
       class="flex items-center px-3 py-2.5 rounded-lg font-medium transition-colors
              {% if request.resolver_match.url_name == 'inventariostock' %}text-green-800 bg-green-100{% else %}text-gray-600 hover:bg-gray-50 hover:text-green-700{% endif %}">
        <span class="material-icons mr-3 {% if request.resolver_match.url_name == 'inventariostock' %}text-green-700{% else %}text-gray-400{% endif %}">inventory_2</span>
        Materias Primas
    </a>

    <a href="{% url 'registrar_materia_prima' %}"
       class="flex items-center px-3 py-2.5 rounded-lg font-medium transition-colors
              {% if request.resolver_match.url_name == 'registrar_materia_prima' %}text-green-800 bg-green-100{% else %}text-gray-600 hover:bg-gray-50 hover:text-green-700{% endif %}">
        <span class="material-icons mr-3 {% if request.resolver_match.url_name == 'registrar_materia_prima' %}text-green-700{% else %}text-gray-400{% endif %}">receipt_long</span>
        Registro de Ingresos
    </a>

    <a href="{% url 'consumos' %}"
    class="flex items-center px-3 py-2.5 rounded-lg font-medium transition-colors
          {% if request.resolver_match.url_name in 'consumos registrar_consumo' %}text-green-800 bg-green-100{% else %}text-gray-600 hover:bg-gray-50 hover:text-green-700{% endif %}">
    <span class="material-icons mr-3 {% if request.resolver_match.url_name in 'consumos registrar_consumo' %}text-green-700{% else %}text-gray-400{% endif %}">shopping_cart</span>
    Consumo y Salidas
    </a>

    <a href="{% url 'historial' %}"
       class="flex items-center px-3 py-2.5 rounded-lg font-medium transition-colors
              {% if request.resolver_match.url_name == 'historial' %}text-green-800 bg-green-100{% else %}text-gray-600 hover:bg-gray-50 hover:text-green-700{% endif %}">
        <span class="material-icons mr-3 {% if request.resolver_match.url_name == 'historial' %}text-green-700{% else %}text-gray-400{% endif %}">shopping_cart</span>
        Historial de Movimientos
    </a>


    <a href="{% url 'proveedores' %}"
    class="flex items-center px-3 py-2.5 rounded-lg font-medium transition-colors
          {% if request.resolver_match.url_name in 'proveedores crear_proveedor editar_proveedor' %}text-green-800 bg-green-100{% else %}text-gray-600 hover:bg-gray-50 hover:text-green-700{% endif %}">
    <span class="material-icons mr-3 {% if request.resolver_match.url_name in 'proveedores crear_proveedor editar_proveedor' %}text-green-700{% else %}text-gray-400{% endif %}">local_shipping</span>
    Proveedores
    </a>
    <a href="{% url 'reportes' %}"
    class="flex items-center px-3 py-2.5 rounded-lg font-medium transition-colors
          {% if request.resolver_match.url_name == 'reportes' %}text-green-800 bg-green-100{% else %}text-gray-600 hover:bg-gray-50 hover:text-green-700{% endif %}">
    <span class="material-icons mr-3 {% if request.resolver_match.url_name == 'reportes' %}text-green-700{% else %}text-gray-400{% endif %}">description</span>
    Reportes
    </a>
    </div>
    
</nav>
    </aside>

    <!-- CONTENEDOR DERECHO (Top Bar + Contenido Principal) -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- BARRA SUPERIOR (Top Navbar) -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10">
            <!-- Izquierda: Menú y Título -->
            <div class="flex items-center">
                <button class="text-gray-500 hover:text-gray-700 focus:outline-none mr-4">
                    <span class="material-icons">menu</span>
                </button>
                <span class="text-gray-600 font-medium">Dashboard</span>
            </div>

            <!-- Derecha: Buscador e Íconos -->
            <div class="flex items-center space-x-5">
                <button class="text-gray-400 hover:text-gray-600 transition-colors">
                    <span class="material-icons">search</span>
                </button>
                <button class="text-gray-400 hover:text-gray-600 transition-colors">
                    <span class="material-icons">notifications_none</span>
                </button>
                <!-- Ícono de mensajes con alerta roja -->
                <button class="text-gray-400 hover:text-gray-600 transition-colors relative">
                    <span class="material-icons">mail_outline</span>
                    <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"></span>
                </button>
                <!-- Perfil de usuario -->
                <button class="flex items-center focus:outline-none">
                    <span class="material-icons text-green-800 text-3xl">account_circle</span>
                </button>
            </div>
        </header>

        <!-- CONTENIDO DINÁMICO (El espacio donde se inyecta dashboard.html, etc.) -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-8">
            {% block content %}
            {% endblock %}
        </main>
    </div>

</body>
</html>
