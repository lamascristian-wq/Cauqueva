<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - CAUQUEVA</title>
    <!-- Conectamos Bootstrap para que se vea igual de profesional que el panel -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🌱 Cooperativa CAUQUEVA</span>
        </div>
    </nav>

    <!-- Usamos un contenedor más angosto (max-width: 600px) para que el formulario no se estire por toda la pantalla -->
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-success mb-4">Registrar Nueva Materia Prima</h3>
                
                <!-- method="POST" es obligatorio para enviar información privada/nueva -->
                <form method="POST">
                    <!-- SEGURIDAD: Esto es obligatorio en Django para evitar ataques de hackers (falsificación de peticiones) -->
                    {% csrf_token %}
                    
                    <!-- Aquí Django "dibuja" automáticamente las cajas de texto que configuramos en forms.py -->
                    {{ formulario.as_p }}
                    
                    <!-- Botones de acción -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success">Guardar Producto</button>
                        <!-- Este botón nos devuelve al inicio sin guardar nada -->
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancelar y Volver</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
