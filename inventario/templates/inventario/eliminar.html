<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Producto - CAUQUEVA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🌱 Cooperativa CAUQUEVA</span>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center">
                <h3 class="card-title text-danger mb-4">⚠️ Confirmar Eliminación</h3>
                
                <p class="fs-5">¿Estás seguro de que deseas eliminar el producto <strong>{{ producto.nombre }}</strong> ({{ producto.variedad }})?</p>
                <p class="text-muted">Esta acción no se puede deshacer y borrará el producto de la base de datos.</p>
                
                <!-- Formulario de confirmación -->
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sí, eliminar producto</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
