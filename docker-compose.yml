version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=cauqueva_db
      - POSTGRES_USER=usuario_cauqueva
      - POSTGRES_PASSWORD=contrasena_segura
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://usuario_cauqueva:contrasena_segura@db:5432/cauqueva_db

volumes:
  postgres_data: